<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Inn | Fortress Edition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo" onclick="showView('feed')">
        <img src="logo.svg" alt="Campus Inn Logo" width="35" height="35">
        <span>Campus Inn</span>
    </div>
    <div style="display:flex; align-items:center;">
        <span class="nav-link" onclick="showView('feed')">Home</span>
        <span class="nav-link" id="profile-btn" style="display:none;" onclick="showView('profile')">Profile</span>
        <div id="authArea"></div>
    </div>
</nav>

<div id="feed-view">
    <div id="editor" style="display:none; margin-bottom: 30px;">
        <div class="post">
            <input id="postTitle" class="input-box" placeholder="What's the headline?">
            <textarea id="postContent" class="input-box" style="height:80px" placeholder="Details..."></textarea>
            <input type="file" id="postFile" class="input-box" accept="image/*">
            <button onclick="addPost()" id="uploadBtn" class="btn-primary">Post to Campus</button>
        </div>
    </div>
    <div id="posts"></div>
</div>

<div id="profile-view">
    <div class="post" style="text-align:center;">
        <img id="p-img" class="profile-avatar">
        <h2 id="p-name" style="margin:0"></h2>
        <div style="text-align:left; margin-top:25px;">
            <label class="input-label">Bio</label>
            <input id="u-bio" class="input-box">
            <label class="input-label">Major</label>
            <input id="u-dept" class="input-box">
            <button onclick="saveProfile()" class="btn-primary">Save Changes</button>
            <button onclick="logout()" class="logout-btn">Sign Out</button>
        </div>
    </div>
</div>

<div id="visit-view">
    <div class="post" style="text-align:center;">
        <img id="v-img" class="profile-avatar" style="border:2px solid var(--text-dim)">
        <h2 id="v-name" style="margin:0"></h2>
        <p id="v-bio" class="visit-bio"></p>
        <p id="v-dept" class="visit-dept"></p>
    </div>
    <div id="v-posts"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
