<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Inn | Verified</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030712; --glass: rgba(31, 41, 55, 0.6); --accent: #818cf8; --text-main: #f3f4f6; --text-dim: #9ca3af; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top right, #1e1b4b, var(--bg)); color: var(--text-main); min-height: 100vh; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 8%; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .nav-link { cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.3s; color: var(--text-dim); margin-right: 20px; }
        .nav-link:hover, .nav-link.active { color: var(--accent); }

        #feed-view, #profile-view { padding: 40px 8%; max-width: 900px; margin: 0 auto; }
        #profile-view { display: none; }

        .post { background: var(--glass); border-radius: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; transition: 0.3s; }
        .post:hover { border-color: rgba(129, 140, 248, 0.3); }

        .input-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 10px; box-sizing: border-box; transition: 0.3s; }
        .input-box:focus { border-color: var(--accent); outline: none; background: rgba(255,255,255,0.06); }
        
        .btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        .reply-item { background: rgba(255,255,255,0.04); padding: 10px; border-radius: 10px; margin-top: 8px; font-size: 0.85rem; border-left: 3px solid var(--accent); }
        .login-prompt { text-align: center; padding: 20px; background: rgba(129, 140, 248, 0.1); border-radius: 15px; border: 1px dashed var(--accent); margin-bottom: 30px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Campus Inn</div>
    <div>
        <span class="nav-link active" onclick="showView('feed')">Home</span>
        <span class="nav-link" id="profile-btn" style="display:none;" onclick="showView('profile')">My Profile</span>
        <span id="authArea"></span>
    </div>
</nav>

<div id="feed-view">
    <!-- POST EDITOR: Only shown to logged in users -->
    <div id="editor" style="display:none; margin-bottom: 40px;">
        <div class="post" style="background: rgba(255,255,255,0.02);">
            <h3 style="margin-top:0">Share an Update</h3>
            <input id="postTitle" class="input-box" placeholder="What's the headline?">
            <textarea id="postContent" class="input-box" style="height: 100px;" placeholder="Tell the campus more..."></textarea>
            <button onclick="addPost()" class="btn-primary" style="width:100%">Post Anonymously</button>
        </div>
    </div>

    <!-- GUEST PROMPT: Shown only to logged out users -->
    <div id="guest-msg" class="login-prompt">
        <p style="margin:0 0 10px 0; color:var(--text-dim);">Want to join the conversation?</p>
        <button onclick="login()" class="btn-primary">Login to Post or Reply</button>
    </div>

    <div id="posts"></div>
</div>

<div id="profile-view">
    <div class="post" style="text-align:center;">
        <img id="p-img" style="width:100px; border-radius:50%; border:3px solid var(--accent); margin-bottom:15px;">
        <h2 id="p-name" style="margin:0"></h2>
        <div style="text-align:left; margin-top:30px;">
            <label style="font-size:0.8rem; color:var(--accent);">Bio</label>
            <input id="u-bio" class="input-box" placeholder="Short bio...">
            <label style="font-size:0.8rem; color:var(--accent);">Department</label>
            <input id="u-dept" class="input-box" placeholder="e.g. Computer Science">
            <button onclick="saveProfile()" class="btn-primary" style="width:100%; margin-top:10px;">Save Profile</button>
            <button onclick="logout()" style="background:none; border:none; color:#ef4444; cursor:pointer; width:100%; margin-top:20px; font-weight:600;">Sign Out</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, setDoc, doc, getDoc, updateDoc, increment, arrayUnion, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNj63exOWvuoD1gNwpYTCZNdJarQJxu5U",
        authDomain: "campusconnect-d5fc1.firebaseapp.com",
        projectId: "campusconnect-d5fc1",
        storageBucket: "campusconnect-d5fc1.firebasestorage.app",
        messagingSenderId: "571562855908",
        appId: "1:571562855908:web:44e5d10e4b062412c38bf1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    window.showView = (v) => {
        document.getElementById('feed-view').style.display = v === 'feed' ? 'block' : 'none';
        document.getElementById('profile-view').style.display = v === 'profile' ? 'block' : 'none';
    };

    onAuthStateChanged(auth, async (user) => {
        const authArea = document.getElementById('authArea');
        const profileBtn = document.getElementById('profile-btn');
        const editor = document.getElementById('editor');
        const guestMsg = document.getElementById('guest-msg');

        if (user) {
            currentUser = user;
            authArea.innerHTML = `<img src="${user.photoURL}" style="width:32px; border-radius:50%; border:2px solid var(--accent); vertical-align:middle; cursor:pointer;" onclick="showView('profile')">`;
            profileBtn.style.display = 'inline';
            editor.style.display = 'block';
            guestMsg.style.display = 'none';
            
            document.getElementById('p-img').src = user.photoURL;
            document.getElementById('p-name').innerText = user.displayName;
            
            const uDoc = await getDoc(doc(db, "users", user.uid));
            if(uDoc.exists()) {
                document.getElementById('u-bio').value = uDoc.data().bio || "";
                document.getElementById('u-dept').value = uDoc.data().dept || "";
            }
        } else {
            currentUser = null;
            authArea.innerHTML = `<button onclick="login()" style="background:var(--accent); border:none; color:white; padding:8px 18px; border-radius:10px; cursor:pointer; font-weight:600;">Login</button>`;
            profileBtn.style.display = 'none';
            editor.style.display = 'none';
            guestMsg.style.display = 'block';
        }
    });

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth).then(() => location.reload());

    window.saveProfile = async () => {
        if(!currentUser) return;
        await setDoc(doc(db, "users", currentUser.uid), {
            bio: document.getElementById('u-bio').value,
            dept: document.getElementById('u-dept').value
        }, { merge: true });
        alert("Profile Updated!");
    };

    window.addPost = async () => {
        const t = document.getElementById('postTitle').value;
        const c = document.getElementById('postContent').value;
        if(!t || !c || !currentUser) return;
        await addDoc(collection(db, "posts"), {
            title: t, content: c, uid: currentUser.uid, 
            userName: currentUser.displayName, userImg: currentUser.photoURL,
            time: Date.now(), likes: 0, replies: []
        });
        document.getElementById('postTitle').value = "";
        document.getElementById('postContent').value = "";
    };

    window.sendReply = async (id) => {
        if(!currentUser) { alert("Please login to reply!"); return; }
        const val = document.getElementById(`re-${id}`).value;
        if(!val) return;
        await updateDoc(doc(db, "posts", id), {
            replies: arrayUnion({ user: currentUser.displayName, text: val })
        });
        document.getElementById(`re-${id}`).value = "";
    };

    window.deletePost = (id) => { if(confirm("Permanently delete this post?")) deleteDoc(doc(db, "posts", id)); };
    window.like = (id) => {
        if(!currentUser) { alert("Login to like posts!"); return; }
        updateDoc(doc(db, "posts", id), { likes: increment(1) });
    };

    // REAL-TIME FEED LISTENER
    onSnapshot(query(collection(db, "posts"), orderBy("time", "desc")), (snap) => {
        const box = document.getElementById('posts');
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            const isOwner = currentUser && d.uid === currentUser.uid;
            const postEl = document.createElement('div');
            postEl.className = 'post';
            
            // Only show reply input if user is logged in
            const replyInputHtml = currentUser ? `
                <div style="display:flex; gap:8px; margin-top:15px;">
                    <input id="re-${doc.id}" class="input-box" style="margin:0; font-size:0.8rem;" placeholder="Write a reply...">
                    <button onclick="sendReply('${doc.id}')" class="btn-primary" style="width:auto; padding:0 15px;"><i class="fas fa-paper-plane"></i></button>
                </div>
            ` : `<p style="font-size:0.75rem; color:var(--text-dim); margin-top:15px; text-align:center;">Login to reply to this post</p>`;

            postEl.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
                    <img src="${d.userImg}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">
                    <span style="font-size:0.85rem; font-weight:600; color:var(--accent);">${d.userName}</span>
                </div>
                <h3 style="margin: 0 0 8px 0; line-height:1.4;">${d.title}</h3>
                <p style="font-size:0.9rem; color:var(--text-dim); line-height:1.6; margin-bottom:20px;">${d.content}</p>
                
                <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span onclick="like('${doc.id}')" style="cursor:pointer; font-size:0.9rem;">
                        <i class="fas fa-heart" style="color:#ef4444; margin-right:5px;"></i> ${d.likes}
                    </span>
                    ${isOwner ? `<i class="fas fa-trash-alt" onclick="deletePost('${doc.id}')" style="cursor:pointer; opacity:0.4; font-size:0.8rem;"></i>` : ''}
                </div>

                <div style="margin-top:15px;">
                    <div id="reply-list">${(d.replies || []).map(r => `
                        <div class="reply-item">
                            <b style="color:var(--accent); display:block; font-size:0.75rem; margin-bottom:2px;">${r.user}</b>
                            ${r.text}
                        </div>
                    `).join('')}</div>
                    ${replyInputHtml}
                </div>
            `;
            box.appendChild(postEl);
        });
    });
</script>
</body>
</html>
