<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Inn | Ultra</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030712;
            --glass: rgba(31, 41, 55, 0.6);
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.4);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
        }

        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg));
            color: var(--text-main); min-height: 100vh;
        }

        /* --- MODERN NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.5rem 8%; background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-weight: 800; font-size: 1.5rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-link { cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.3s; color: var(--text-dim); }
        .nav-link:hover, .nav-link.active { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        /* --- PROFILE VIEW --- */
        #profile-view { display: none; padding: 40px 10%; max-width: 800px; margin: 0 auto; }
        .profile-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 40px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .profile-img-large { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent); margin-bottom: 20px; }

        /* --- MODERN POST CARDS (FANTASY LOOK) --- */
        #feed-view { padding: 20px 8%; }
        #posts { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 25px; margin-top: 40px; 
        }
        .post {
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }
        .post:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
        }
        .post::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }
        .post:hover::before { left: 100%; }

        .post-tag {
            position: absolute; top: 20px; right: 20px;
            font-size: 0.6rem; font-weight: 800; background: var(--accent);
            color: white; padding: 4px 12px; border-radius: 50px;
        }

        /* --- INPUT FIELDS --- */
        .input-box {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 14px; border-radius: 12px; width: 100%; margin-bottom: 15px; box-sizing: border-box;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white; border: none; padding: 14px 28px; border-radius: 12px;
            font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }

        /* --- SEARCH & FILTERS --- */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .search-wrapper { position: relative; width: 300px; }
        .search-wrapper i { position: absolute; left: 15px; top: 14px; color: var(--text-dim); }
        .search-wrapper input { padding-left: 45px !important; }

        @media (max-width: 768px) { #posts { grid-template-columns: 1fr; } }
    </style>
</head>

<body>

<nav>
    <div class="logo">Campus Inn</div>
    <div class="nav-links">
        <span class="nav-link active" onclick="showView('feed')">Home</span>
        <span class="nav-link" onclick="showView('profile')">Profile</span>
        <div id="authArea"><button onclick="login()" class="btn-primary" style="padding: 8px 16px;">Login</button></div>
    </div>
</nav>

<div id="feed-view">
    <div class="top-bar">
        <h1>Campus <span style="color:var(--accent)">Pulse</span></h1>
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchBar" class="input-box" placeholder="Search anything..." onkeyup="filterPosts()">
        </div>
    </div>

    <div id="editor" style="max-width:600px; margin: 0 auto 50px; display:none;">
        <div class="post">
            <h3 style="margin-top:0">Post an Update</h3>
            <input id="postTitle" class="input-box" placeholder="Headline...">
            <textarea id="postContent" class="input-box" placeholder="What's happening?"></textarea>
            <select id="postCat" class="input-box">
                <option value="Update">Update</option>
                <option value="Event">Event</option>
                <option value="Alert">Alert</option>
            </select>
            <button onclick="addPost()" id="postBtn" class="btn-primary">Blast to Campus</button>
        </div>
    </div>

    <div id="posts"></div>
</div>

<div id="profile-view">
    <div class="profile-card">
        <img id="p-img" class="profile-img-large" src="">
        <h2 id="p-name" style="margin: 0;">User Name</h2>
        <p id="p-email" style="color:var(--text-dim); font-size: 0.9rem;">email@university.edu</p>
        
        <div style="margin-top: 30px; text-align: left;">
            <label style="font-size: 0.8rem; color: var(--accent);">Your Campus Bio</label>
            <textarea id="u-bio" class="input-box" placeholder="e.g. Computer Science '26 | Loves Web Dev"></textarea>
            
            <label style="font-size: 0.8rem; color: var(--accent);">Major/Department</label>
            <input id="u-dept" class="input-box" placeholder="e.g. Engineering">
            
            <button onclick="saveProfile()" class="btn-primary">Update Profile</button>
            <button onclick="logout()" style="background:transparent; color:var(--text-dim); border:none; margin-top:15px; cursor:pointer; width:100%">Logout</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, setDoc, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNj63exOWvuoD1gNwpYTCZNdJarQJxu5U",
        authDomain: "campusconnect-d5fc1.firebaseapp.com",
        projectId: "campusconnect-d5fc1",
        storageBucket: "campusconnect-d5fc1.firebasestorage.app",
        messagingSenderId: "571562855908",
        appId: "1:571562855908:web:44e5d10e4b062412c38bf1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let allPosts = [];

    // --- VIEW SWITCHER ---
    window.showView = (view) => {
        document.getElementById('feed-view').style.display = view === 'feed' ? 'block' : 'none';
        document.getElementById('profile-view').style.display = view === 'profile' ? 'block' : 'none';
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        event.target.classList.add('active');
    };

    // --- AUTH & PROFILE SYNC ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('authArea').innerHTML = `<img src="${user.photoURL}" style="width:40px; border-radius:50%; cursor:pointer;" onclick="showView('profile')">`;
            document.getElementById('editor').style.display = 'block';
            
            // Set basic profile info
            document.getElementById('p-img').src = user.photoURL;
            document.getElementById('p-name').innerText = user.displayName;
            document.getElementById('p-email').innerText = user.email;

            // Load extra bio from Firestore
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                document.getElementById('u-bio').value = userDoc.data().bio || "";
                document.getElementById('u-dept').value = userDoc.data().dept || "";
            }
        } else {
            currentUser = null;
            document.getElementById('authArea').innerHTML = `<button onclick="login()" class="btn-primary" style="padding: 8px 16px;">Login</button>`;
            document.getElementById('editor').style.display = 'none';
        }
    });

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    window.saveProfile = async () => {
        if (!currentUser) return;
        await setDoc(doc(db, "users", currentUser.uid), {
            bio: document.getElementById('u-bio').value,
            dept: document.getElementById('u-dept').value,
            name: currentUser.displayName
        }, { merge: true });
        alert("Profile Synced!");
    };

    // --- POSTING ENGINE ---
    window.addPost = async () => {
        const t = document.getElementById('postTitle').value;
        const c = document.getElementById('postContent').value;
        if(!t || !c) return;

        // Get user dept for the post
        const userDoc = await getDoc(doc(db, "users", currentUser.uid));
        const dept = userDoc.exists() ? userDoc.data().dept : "Student";

        await addDoc(collection(db, "posts"), {
            title: t, content: c, category: document.getElementById('postCat').value,
            uid: currentUser.uid, userName: currentUser.displayName, 
            userImg: currentUser.photoURL, userDept: dept,
            time: Date.now(), likes: 0
        });
        document.getElementById('postTitle').value = "";
        document.getElementById('postContent').value = "";
    };

    // --- RENDER POSTS ---
    const q = query(collection(db, "posts"), orderBy("time", "desc"));
    onSnapshot(q, (snap) => {
        allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render(allPosts);
    });

    function render(data) {
        const box = document.getElementById('posts');
        box.innerHTML = "";
        data.forEach(d => {
            const card = document.createElement('div');
            card.className = 'post';
            card.innerHTML = `
                <span class="post-tag">${d.category}</span>
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px;">
                    <img src="${d.userImg}" style="width:35px; border-radius:50%">
                    <div>
                        <div style="font-size:0.8rem; font-weight:700;">${d.userName}</div>
                        <div style="font-size:0.6rem; color:var(--accent);">${d.userDept || 'Student'}</div>
                    </div>
                </div>
                <h3 style="margin:0 0 10px 0;">${d.title}</h3>
                <p style="font-size:0.85rem; color:var(--text-dim);">${d.content}</p>
                <div style="margin-top:20px; display:flex; gap:15px; font-size:0.8rem;">
                    <span onclick="like('${d.id}')" style="cursor:pointer"><i class="fas fa-heart" style="color:#ef4444"></i> ${d.likes || 0}</span>
                </div>
            `;
            box.appendChild(card);
        });
    }

    window.like = (id) => updateDoc(doc(db, "posts", id), { likes: increment(1) });
</script>

</body>
</html>
