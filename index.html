<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Inn | Pro</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; }

        /* --- NAV & AUTH --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 5%; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-profile img { width: 35px; border-radius: 50%; border: 2px solid var(--accent); }
        .btn-login { background: white; color: black; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; }

        /* --- SEARCH BAR --- */
        .search-container { padding: 20px 10%; text-align: center; }
        #searchBar {
            width: 100%; max-width: 500px; padding: 12px 20px;
            border-radius: 50px; border: 1px solid #334155;
            background: var(--card-bg); color: white; outline: none;
        }

        /* --- FEED SECTION --- */
        .blog { padding: 20px 10%; }
        .input-group {
            background: var(--card-bg); padding: 25px; border-radius: 20px;
            max-width: 600px; margin: 0 auto 40px auto;
            display: none; /* Hidden until login */
        }

        #posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .post {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            transition: 0.3s; position: relative; border: 1px solid rgba(255,255,255,0.05);
        }
        .post:hover { transform: translateY(-5px); border-color: var(--accent); }

        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .post-header img { width: 30px; border-radius: 50%; }
        .post-header .name { font-size: 0.85rem; font-weight: 600; }
        .post-header .time { font-size: 0.7rem; color: var(--text-dim); }

        .post-tag { font-size: 0.65rem; text-transform: uppercase; background: rgba(99, 102, 241, 0.2); color: var(--accent); padding: 3px 8px; border-radius: 4px; font-weight: 700; }
        
        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .like-btn { cursor: pointer; color: var(--text-dim); transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .like-btn:hover { color: var(--danger); }
        .like-btn.active { color: var(--danger); }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 600px) { .blog { padding: 10px 5%; } }
    </style>
</head>

<body>

<nav>
    <div style="font-weight:700; color:var(--accent);">CAMPUS INN</div>
    <div id="authArea">
        <button class="btn-login" onclick="login()">Login with Google</button>
    </div>
</nav>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="🔍 Search campus posts..." onkeyup="filterPosts()">
</div>

<section class="blog">
    <div class="input-group" id="editor">
        <h4 style="margin-top:0;">Create a Post</h4>
        <input id="title" placeholder="What's the headline?">
        <select id="category">
            <option value="General">General</option>
            <option value="Exam">Exam News</option>
            <option value="Event">Events</option>
            <option value="Lost">Lost & Found</option>
        </select>
        <textarea id="content" placeholder="Tell the campus more..." rows="3"></textarea>
        <button onclick="addPost()" id="postBtn">Publish Post</button>
    </div>

    <div id="posts"></div>
</section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNj63exOWvuoD1gNwpYTCZNdJarQJxu5U",
        authDomain: "campusconnect-d5fc1.firebaseapp.com",
        projectId: "campusconnect-d5fc1",
        storageBucket: "campusconnect-d5fc1.firebasestorage.app",
        messagingSenderId: "571562855908",
        appId: "1:571562855908:web:44e5d10e4b062412c38bf1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let allPosts = [];

    // --- AUTH LOGIC ---
    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        const authArea = document.getElementById("authArea");
        const editor = document.getElementById("editor");
        if (user) {
            currentUser = user;
            authArea.innerHTML = `
                <div class="user-profile">
                    <img src="${user.photoURL}">
                    <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor:pointer"></i>
                </div>`;
            editor.style.display = "block";
        } else {
            currentUser = null;
            authArea.innerHTML = `<button class="btn-login" onclick="login()">Login with Google</button>`;
            editor.style.display = "none";
        }
    });

    // --- UTILITY: TIME AGO ---
    function timeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return "Just now";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + "m ago";
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + "h ago";
        return Math.floor(hours / 24) + "d ago";
    }

    // --- ADD POST ---
    window.addPost = async function () {
        const title = document.getElementById("title").value;
        const category = document.getElementById("category").value;
        const content = document.getElementById("content").value;
        const btn = document.getElementById("postBtn");

        if(!title || !content) return;

        btn.disabled = true;
        await addDoc(collection(db, "posts"), {
            title, category, content,
            time: Date.now(),
            likes: 0,
            userName: currentUser.displayName,
            userImg: currentUser.photoURL
        });
        
        document.getElementById("title").value = "";
        document.getElementById("content").value = "";
        btn.disabled = false;
    };

    // --- LIKE LOGIC ---
    window.likePost = async (id) => {
        const postRef = doc(db, "posts", id);
        await updateDoc(postRef, { likes: increment(1) });
    };

    // --- RENDER & FILTER ---
    const q = query(collection(db, "posts"), orderBy("time", "desc"));
    onSnapshot(q, (snap) => {
        allPosts = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render(allPosts);
    });

    function render(data) {
        const box = document.getElementById("posts");
        box.innerHTML = data.length ? "" : "<p style='text-align:center; color:gray;'>No posts found...</p>";

        data.forEach(d => {
            const card = document.createElement('div');
            card.className = 'post';
            card.innerHTML = `
                <div class="post-header">
                    <img src="${d.userImg || 'https://via.placeholder.com/30'}">
                    <div>
                        <div class="name">${d.userName || 'Anonymous'}</div>
                        <div class="time">${timeAgo(d.time)}</div>
                    </div>
                </div>
                <span class="post-tag">${d.category}</span>
                <h3 style="margin: 10px 0 5px 0;">${d.title}</h3>
                <p style="font-size:0.9rem; color:var(--text-dim);">${d.content}</p>
                <div class="post-footer">
                    <div class="like-btn" onclick="likePost('${d.id}')">
                        <i class="fas fa-heart"></i> <span>${d.likes || 0}</span>
                    </div>
                    <i class="fas fa-share-alt" style="color:gray; font-size:0.8rem;"></i>
                </div>
            `;
            box.appendChild(card);
        });
    }

    window.filterPosts = () => {
        const term = document.getElementById("searchBar").value.toLowerCase();
        const filtered = allPosts.filter(p => 
            p.title.toLowerCase().includes(term) || 
            p.content.toLowerCase().includes(term) ||
            p.category.toLowerCase().includes(term)
        );
        render(filtered);
    };
</script>

</body>
</html>
